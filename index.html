<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>

<style>
:root{--p:#fff;--s:#9a9a9a;--a:#d0d0d0;--bt:#fff;--btt:#000;--tx:#fff;--op:.45;--bl:22px;--g:18,18,18;--bg:#000;--bd:rgba(255,255,255,.14);--f:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;--r:22px}

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:var(--f);background:var(--bg);color:var(--tx);line-height:1.5;overflow-x:hidden;min-height:100vh}

.glass{background:rgba(var(--g),var(--op));-webkit-backdrop-filter:blur(var(--bl)) saturate(140%);backdrop-filter:blur(var(--bl)) saturate(140%);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.07);cursor:pointer;transition:transform .2s,background .2s,opacity .2s;font-weight:600;text-decoration:none;color:var(--tx)}

.btn.pr:hover{opacity:.88;background:var(--bt)}

.btn.dg{color:#ff6b6b}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(128,128,128,.12)}

label{display:block;font-size:.85rem;color:var(--s);margin:12px 0 5px}
input[type=color]{padding:3px;height:46px}input[type=checkbox]{width:auto;min-height:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:fixed;top:12px;left:12px;right:12px;z-index:50;max-width:1080px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;animation:dn .7s both}

section{padding:46px 0}
.panel{padding:clamp(20px,5vw,44px);animation:up .7s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
h1{font-size:clamp(2.2rem,8vw,4.6rem);line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:14px;letter-spacing:-.02em}

#home{padding-top:110px;min-height:88vh;display:flex;align-items:center}
#home .panel{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.card{padding:18px;text-align:center;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px)}
.card.on{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.av{width:92px;height:92px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--bd)}

.steps b{display:block;font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.slot{min-height:46px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.06);cursor:pointer;transition:.2s}
.slot:hover{background:rgba(255,255,255,.15)}.slot.on{background:var(--bt);color:var(--btt)}
.step{animation:up .4s both}
.sum{padding:16px;border-radius:16px;background:rgba(128,128,128,.12);margin-top:12px;white-space:pre-line}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:14px;animation:fd .25s}

@keyframes fd{from{opacity:0}}

.ah{position:sticky;top:0;z-index:2;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}
.tabs .btn{white-space:nowrap}.tabs .btn.on{background:var(--bt);color:var(--btt)}
.ab{max-width:900px;margin:0 auto;padding:6px 12px 60px}
.box{padding:18px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp .glass{padding:16px}.kp b{font-size:1.9rem;display:block}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}
#ts{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:200;padding:12px 20px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#ts.show{opacity:1;transform:translate(-50%,0)}
footer{padding:30px 16px 40px;text-align:center;color:var(--s);font-size:.85rem}
footer button{background:none;border:0;color:var(--s);opacity:.45;font-size:.72rem;cursor:pointer;margin-top:10px;padding:8px}
@media(max-width:760px){nav{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;padding:12px;border-radius:var(--r);background:rgba(var(--g),.85);-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));border:1px solid var(--bd);animation:up .3s both}
nav.open{display:flex}nav a{width:100%;text-align:center;padding:14px}#bg{display:block}header>.btn{margin-left:auto}header>#bg{margin-left:0}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation}
:focus:not(:focus-visible){outline:none}
button,.btn{-webkit-appearance:none;appearance:none}
input,select,textarea{font-size:16px}
header.glass{border-radius:999px;padding:8px 10px 8px 22px}
#bg{display:flex;align-items:center;justify-content:center;margin-left:auto;width:46px;height:46px;padding:0;color:var(--tx);background:rgba(255,255,255,.07)}
#nav{display:none;position:fixed;top:78px;right:12px;left:auto;width:min(250px,calc(100vw - 24px));flex-direction:column;gap:2px;padding:10px;border-radius:28px;z-index:49;margin:0}
#nav.open{display:flex;animation:up .3s both}
#nav a{width:100%;text-align:left;padding:14px 18px;border-radius:18px;font-size:1rem}
#nav a.on{color:var(--tx);font-weight:800;background:rgba(255,255,255,.14)}
.pg{padding:0 0 30px}
#home,#agendar,#contato{display:none;min-height:0;align-items:initial}
#home.on,#agendar.on,#contato.on{display:block}
#agendar,#contato{padding-top:100px}
.hero{position:relative;margin:0 -16px;height:82vh;min-height:460px;display:flex;align-items:flex-end;background:radial-gradient(600px 400px at 70% 20%,rgba(255,255,255,.1),transparent);overflow:hidden;animation:up .7s both}
.hi{position:absolute;inset:0;background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 28%,rgba(0,0,0,.55) 66%,var(--bg) 100%)}
.hc{position:relative;z-index:1;padding:0 22px 34px;width:100%;max-width:1080px;margin:0 auto}
.mp{max-width:1080px;margin:16px auto 0;padding:8px;overflow:hidden;text-align:left}
.mp iframe{display:block;width:100%;height:260px;border:0;border-radius:calc(var(--r) - 8px)}
header>#bg{margin-left:auto}
.sb{position:sticky;bottom:14px;margin:0 auto;width:max-content;max-width:calc(100% - 24px);padding:8px;z-index:3;border-radius:999px}
</style>
</head>
<body>
<header class="glass"><a class="logo" href="#home" id="lg"></a><button id="bg" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">☰</button></header>
<nav id="nav" class="glass" aria-label="Menu principal"><a href="#home">Home</a><a href="#agendar">Agendar</a><a href="#contato">Contato</a></nav>
<main class="wrap">
<section class="pg on" id="home">
<div class="hero"><div class="hi" id="hi"></div><div class="hc"><p class="muted" id="hn"></p><h1 id="ht"></h1><p style="margin-top:12px;max-width:560px" id="hs"></p></div></div>

</main>
<footer><div id="fn"></div><div id="fa" style="margin-top:6px"></div><div class="glass mp" id="mp" style="display:none"></div><button id="admb" aria-label="Área administrativa">Área administrativa</button></footer>
<div class="ov" id="ov"><div class="glass mb" id="mb" role="dialog" aria-modal="true"></div></div>
<div id="adm"></div>
<div id="ts" class="glass" role="status"></div>
<script>
const SRC0='<!DOCTYPE html>\n'+document.documentElement.outerHTML;/* cópia do código original, usada para gerar o site atualizado */
/* ===== CONFIGURAÇÃO ===== */
/* AVISO: a senha em JavaScript/localStorage NÃO é segurança real de servidor. Qualquer pessoa pode ler o código. Serve apenas para uso local/frontend. */
const K={c:'bb_siteConfig',b:'bb_barbers',a:'bb_appointments'};
const DEF={name:'BLACK BARBER',logo:'',title:'Seu estilo começa aqui.',sub:'Barbearia premium',desc:'Agende seu horário com seu barbeiro favorito de forma rápida e simples.',btn:'Agendar horário',about:'Uma barbearia de alto padrão, com atendimento exclusivo, ambiente sofisticado e profissionais apaixonados pelo que fazem.',phone:'(11) 99999-9999',addr:'Rua Exemplo, 123 - Centro',insta:'@blackbarber',info:'Seg a Sáb, das 09h às 18h',wa:'',map:'',heroImg:'',pass:'529529',theme:'dark',primary:'#ffffff',secondary:'#9a9a9a',accent:'#d0d0d0',btnc:'#ffffff',text:'#ffffff',op:.45,blur:22,font:'Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif'};
const T=['09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
const DEFB=()=>[{id:'b1',name:'Lucas',photo:'',desc:'Especialista em degradê e cortes modernos.',wa:'',days:[1,2,3,5],times:[...T],active:true},{id:'b2',name:'Rafael',photo:'',desc:'Barba, navalha e cortes clássicos.',wa:'',days:[2,4,6],times:['10:00','11:00','14:00','15:00','16:00'],active:true}];
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const FONTS={Inter:'Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif',Poppins:'Poppins,Arial,sans-serif',Montserrat:'Montserrat,Arial,sans-serif',Arial:'Arial,Helvetica,sans-serif','System UI':'system-ui,-apple-system,Segoe UI,sans-serif'};

/* ===== STORAGE ===== */
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Sem espaço para salvar (imagem muito grande?).');return false}};
/* PUB = configuração publicada dentro do próprio arquivo (vale para todos os visitantes). O navegador do ADM só usa a cópia local se ela for mais nova. */
const PUB=/*PUBDATA*/null/*END*/;
const useL=!PUB||ld('bb_ver',0)>PUB.v;
let cfg=Object.assign({},DEF,useL?ld(K.c,{}):PUB.cfg);
let barbers=useL?ld(K.b,null):PUB.barbers;if(!Array.isArray(barbers))barbers=DEFB();
let dirty=false;
function mark(){dirty=true;const b=$('#svb');if(b)b.textContent='Salvar alterações •'}
function persist(){const ok=sv(K.c,cfg)&&sv(K.b,barbers)&&sv('bb_ver',Date.now());if(ok){dirty=false;const b=$('#svb');if(b)b.textContent='Salvar alterações'}return ok}
function pubFile(){const data=JSON.stringify({v:ld('bb_ver',Date.now()),cfg,barbers}).replace(/</g,'\\u003c');
const html=SRC0.replace(/\/\*PUBDATA\*\/[\s\S]*?\/\*END\*\//,()=>'/*PUBDATA'+'*/'+data+'/*END'+'*/');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

/* ===== SUPABASE (banco online) =====
   Preencha url e key (Project URL e anon public key). Se ficarem vazios, o site funciona só com localStorage.
   A senha do ADM e a gravação ficam protegidas no servidor (funções SQL do arquivo supabase.sql). */
const SB={url:'https://yhidxiuhousyhjzspgxx.supabase.co',key:'sb_publishable_sh1C-JVxSvj8zF4jHSu94Q_3K6BRWyz'};
const ON=!!(SB.url&&SB.key);
let busy=[],ADM='';
if(ON){const c=ld('bb_cache',null);if(c){cfg=Object.assign({},DEF,c.cfg);barbers=c.barbers}cfg.pass=''}
async function rpc(n,a){const r=await fetch(SB.url.replace(/\/$/,'')+'/rest/v1/rpc/'+n,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB.key,...(SB.key.startsWith('eyJ')?{Authorization:'Bearer '+SB.key}:{})},body:JSON.stringify(a||{})});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function refreshBusy(){if(ON)busy=(await rpc('get_taken',{p_from:today()}))||[]}
async function pull(){try{const d=await rpc('get_site');if(d&&d.cfg&&Object.keys(d.cfg).length){cfg=Object.assign({},DEF,d.cfg);cfg.pass='';if(Array.isArray(d.barbers))barbers=d.barbers;sv('bb_cache',{cfg,barbers})}await refreshBusy()}catch(e){}applyCfg();renderPublic()}
async function doLogin(){const v=$('#pw').value;
if(!ON){if(v===cfg.pass){closeM();openAdm()}else toast('Senha incorreta.');return}
try{if(await rpc('admin_login',{p_pass:v})===true){ADM=v;closeM();openAdm()}else toast('Senha incorreta.')}catch(e){toast('Sem conexão com o servidor.')}}
async function doSave(){
if(ON){try{
if(cfg.pass&&cfg.pass.length>=4&&cfg.pass!==ADM){if(await rpc('admin_set_pass',{p_pass:ADM,p_new:cfg.pass}))ADM=cfg.pass}
cfg.pass='';const c={...cfg};
if(!await rpc('admin_save',{p_pass:ADM,p_cfg:c,p_barbers:barbers}))return toast('Senha do ADM inválida. Entre de novo.');
sv('bb_cache',{cfg:c,barbers});dirty=false;const b=$('#svb');if(b)b.textContent='Salvar alterações';toast('Salvo para todos os visitantes ✔')}catch(e){toast('Erro ao salvar. Verifique a conexão.')}return}
if(!persist())return;try{pubFile()}catch(e){}
modal(`<h3>Alterações salvas ✔</h3><p class="muted" style="margin:10px 0">Salvas neste navegador. Para <b>todos</b> verem, envie o <b>index.html</b> baixado para a hospedagem ou ligue o Supabase.</p><div class="row"><button class="btn" data-act="pubf">Baixar novamente</button><button class="btn pr" data-act="close">Entendi</button></div>`)}
let appts=ld(K.a,[]);if(!Array.isArray(appts))appts=[];

/* ===== UTILITÁRIOS ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=i=>i?i.split('-').reverse().join('/'):'';
const dow=i=>new Date(i+'T00:00:00').getDay();
const validD=i=>/^\d{4}-\d{2}-\d{2}$/.test(i)&&!isNaN(new Date(i+'T00:00:00'));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bById=id=>barbers.find(b=>b.id===id);
let tt;function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function deb(f,w){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),w)}}
function normT(s){return[...new Set(String(s).split(/[,\s;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d{1,2})(?::?(\d{2}))?$/);return m&&+m[1]<24&&+(m[2]||0)<60?p2(m[1])+':'+(m[2]||'00'):null}).filter(Boolean))].sort()}

/* ===== TEMA / APARÊNCIA ===== */
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
function applyCfg(){const r=document.documentElement.style,s=(k,v)=>r.setProperty(k,v);
document.documentElement.dataset.theme=cfg.theme;
s('--p',cfg.primary);s('--s',cfg.secondary);s('--a',cfg.accent);s('--bt',cfg.btnc);s('--btt',lum(cfg.btnc)>.55?'#000':'#fff');s('--tx',cfg.text);s('--op',cfg.op);s('--bl',cfg.blur+'px');s('--f',cfg.font);document.title=cfg.name}
function setTheme(t){cfg.theme=t;const d=t==='dark';Object.assign(cfg,{primary:d?'#ffffff':'#111111',btnc:d?'#ffffff':'#111111',text:d?'#ffffff':'#111111',secondary:d?'#9a9a9a':'#555555',accent:d?'#d0d0d0':'#333333',op:d?.45:.6});mark();applyCfg()}

/* ===== AGENDAMENTOS / HORÁRIOS ===== */
/* O bloqueio considera SEMPRE barbeiro + data + horário */
const taken=(bid,d,t)=>ON?busy.some(x=>x.b===bid&&x.d===d&&x.t===t):appts.some(a=>a.bid===bid&&a.date===d&&a.time===t);
function freeTimes(b,d){const now=new Date(),hm=p2(now.getHours())+':'+p2(now.getMinutes());return b.times.filter(t=>!taken(b.id,d,t)&&(d!==today()||t>hm))}

/* ===== WHATSAPP ===== */
function waUrl(num,text){num=String(num||'').trim();const q='text='+encodeURIComponent(text);
if(/^https?:\/\//i.test(num))return num+(num.includes('?')?'&':'?')+q;
let d=num.replace(/\D/g,'');if(!d)return null;if(d.length<=11)d='55'+d;return'https://wa.me/'+d+'?'+q}

/* ===== RENDERIZAÇÃO PÚBLICA ===== */
function avatar(b){return b.photo?`<img class="av" src="${esc(b.photo)}" alt="${esc(b.name)}" loading="lazy">`:`<div class="av">${esc(b.name.charAt(0).toUpperCase())}</div>`}
function safeUrl(u){u=String(u||'').trim();return/^(https:\/\/|data:image\/)/i.test(u)?u:''}
function mapSrc(){const m=String(cfg.map||'').trim();if(!m)return'';const i=m.match(/src="([^"]+)"/),u=i?i[1]:m;return/^https:\/\/www\.google\.com\/maps\/embed/i.test(u)?u:'https://www.google.com/maps?q='+encodeURIComponent(cfg.addr||'')+'&output=embed'}
function mapLink(){const m=String(cfg.map||'').trim();return/^https:\/\//i.test(m)?m:'https://www.google.com/maps?q='+encodeURIComponent(cfg.addr||'')}
let lastMap=null;
function renderPublic(){
$('#lg').innerHTML=(cfg.logo?`<img src="${esc(cfg.logo)}" alt="" loading="lazy">`:'')+esc(cfg.name);
$('#hb2').textContent=cfg.btn;$('#hn').textContent=cfg.sub;$('#ht').textContent=cfg.title;$('#hs').textContent=cfg.desc;$('#hd').textContent=cfg.name;$('#ab').textContent=cfg.about;

/* ===== IMAGEM DO DISPOSITIVO (redimensiona e converte p/ Base64) ===== */
function compress(f,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)})}
